# Docker Compose — UI-Agent (one-click local demo)
# Runs: orchestrator (port 3000) + UI server (port 8000) + Ollama (port 11434)
# Usage: docker compose up

version: '3.9'

services:
  # Ollama LLM server (local, privacy-first)
  ollama:
    image: ollama/ollama:latest
    ports:
      - '11434:11434'
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:11434/api/tags']
      interval: 10s
      timeout: 5s
      retries: 5

  # Pull the default model on first run
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ['sh', '-c', 'ollama pull llama3.1:8b']
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: 'no'

  # Orchestrator API (Node.js)
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - LLM_API_MODE=ollama
      - LLM_API_URL=http://ollama:11434
      - LLM_MODEL_NAME=llama3.1:8b
      - LLM_USE_LOCAL=false
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # UI server (static files)
  ui:
    image: python:3.12-slim
    working_dir: /app
    command: python -m http.server 8000
    ports:
      - '8000:8000'
    volumes:
      - ./ui-agent:/app:ro
    restart: unless-stopped

volumes:
  ollama-data:
